name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Node version lives in .nvmrc (and package.json "engines"), so the
      # workflow always matches what the test tools require.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check Node meets package.json engines
        run: node -e 'const r=require("./package.json").engines.node.replace(">=","").split(".").map(Number);const v=process.versions.node.split(".").map(Number);for(let i=0;i<3;i++){if(v[i]>r[i])process.exit(0);if(v[i]<r[i]){console.error("Node "+process.versions.node+" is older than "+r.join("."));process.exit(1)}}'

      - name: Check the tag matches the version
        run: |
          pkg=$(node -p 'require("./package.json").version')
          man=$(node -p 'require("./static/manifest.json").version')
          if [ "v$pkg" != "$GITHUB_REF_NAME" ] || [ "$pkg" != "$man" ]; then
            echo "Tag $GITHUB_REF_NAME, package.json $pkg and manifest.json $man must all match"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build the release zips
        run: npm run package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/ciu-browser.zip "release/ciu-browser-$v.zip" release/ciu-browser-webstore.zip \
            --title "CIU Browser $v (beta)" --notes-file RELEASE_NOTES.md
