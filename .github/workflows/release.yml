name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches the version
        run: |
          pkg=$(node -p 'require("./package.json").version')
          man=$(node -p 'require("./static/manifest.json").version')
          if [ "v$pkg" != "$GITHUB_REF_NAME" ] || [ "$pkg" != "$man" ]; then
            echo "Tag $GITHUB_REF_NAME, package.json $pkg and manifest.json $man must all match"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build the release zips
        run: npm run package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/ciu-browser.zip "release/ciu-browser-$v.zip" \
            --title "CIU Browser $v (beta)" --notes-file RELEASE_NOTES.md
